<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Günlük Cihaz Raporu</title>
    <style>
        body { font-family: sans-serif; margin: 1rem; }
        h1 { font-size: 1.25rem; }
        .device-block { margin-bottom: 2rem; border: 1px solid #ccc; padding: 1rem; border-radius: 4px; }
        .device-header { font-weight: bold; margin-bottom: 0.5rem; }
        .device-meta { color: #555; font-size: 0.9rem; margin-bottom: 1rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
        th { background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>Günlük Cihaz Raporu</h1>
    <p th:if="${dailyReport != null}" th:text="'Rapor Tarihi: ' + ${dailyReport.reportDate}">Rapor Tarihi</p>

    <div th:if="${dailyReport != null and dailyReport.devices != null}" th:each="device : ${dailyReport.devices}" class="device-block">
        <div class="device-header" th:text="${device.deviceName} ?: '(İsimsiz cihaz)'">Cihaz adı</div>
        <div class="device-meta">
            <span th:text="${'Sistem: ' + device.systemName}">Sistem</span>
            <span th:text="${' | Sürüm: ' + device.systemVersion}">Sürüm</span>
            <span th:text="${' | IDFV: ' + device.identifierForVendor}">IDFV</span>
        </div>
        <table th:if="${device.readings != null and !device.readings.isEmpty()}">
            <thead>
                <tr>
                    <th>Kayıt zamanı</th>
                    <th>Bellek (GB)</th>
                    <th>İşlemci (aktif/toplam)</th>
                    <th>Çalışma süresi</th>
                    <th>Disk (toplam/boş GB)</th>
                    <th>Batarya</th>
                    <th>Batarya durumu</th>
                    <th>Termal</th>
                    <th>Bağlantı</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${device.readings}">
                    <td th:text="${r.recordTime}">-</td>
                    <td th:text="${r.physicalMemoryGB}">-</td>
                    <td th:text="${r.processorCountActive + ' / ' + r.processorCountTotal}">-</td>
                    <td th:text="${r.systemUptime}">-</td>
                    <td th:text="${r.totalDiskSpaceGB + ' / ' + r.freeDiskSpaceGB}">-</td>
                    <td th:text="${r.batteryLevel}">-</td>
                    <td th:text="${r.batteryState}">-</td>
                    <td th:text="${r.thermalState}">-</td>
                    <td th:text="${r.connectionType}">-</td>
                </tr>
            </tbody>
        </table>
        <p th:if="${device.readings == null or device.readings.isEmpty()}" class="device-meta">Bu gün için okuma yok.</p>
    </div>

    <p th:if="${dailyReport == null or dailyReport.devices == null or dailyReport.devices.isEmpty()}">Rapor verisi yok.</p>
</body>
</html>
