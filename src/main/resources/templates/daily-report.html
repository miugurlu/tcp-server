<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Daily Device Report</title>
    <style>
        body { font-family: sans-serif; margin: 1rem; }
        h1 { font-size: 1.25rem; }
        .device-block { margin-bottom: 2rem; border: 1px solid #ccc; padding: 1rem; border-radius: 4px; }
        .device-header { font-weight: bold; margin-bottom: 0.5rem; }
        .device-meta { color: #555; font-size: 0.9rem; margin-bottom: 1rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
        th { background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>Daily Device Report</h1>
    <p th:if="${dailyReport != null}" th:text="'Report date: ' + ${dailyReport.reportDate}">Report date</p>

    <div th:if="${dailyReport != null and dailyReport.devices != null}" th:each="device : ${dailyReport.devices}" class="device-block">
        <div class="device-header" th:text="${device.deviceName} ?: '(Unnamed device)'">Device name</div>
        <div class="device-meta">
            <span th:text="${'System: ' + device.systemName}">System</span>
            <span th:text="${' | Version: ' + device.systemVersion}">Version</span>
            <span th:text="${' | IDFV: ' + device.identifierForVendor}">IDFV</span>
        </div>
        <table th:if="${device.readings != null and !device.readings.isEmpty()}">
            <thead>
                <tr>
                    <th>Recorded at</th>
                    <th>Memory (GB)</th>
                    <th>CPU (active/total)</th>
                    <th>Uptime</th>
                    <th>Disk (total/free GB)</th>
                    <th>Battery</th>
                    <th>Battery state</th>
                    <th>Thermal</th>
                    <th>Connection</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${device.readings}">
                    <td th:text="${r.recordTime}">-</td>
                    <td th:text="${r.physicalMemoryGB}">-</td>
                    <td th:text="${r.processorCountActive + ' / ' + r.processorCountTotal}">-</td>
                    <td th:text="${r.systemUptime}">-</td>
                    <td th:text="${r.totalDiskSpaceGB + ' / ' + r.freeDiskSpaceGB}">-</td>
                    <td th:text="${r.batteryLevel}">-</td>
                    <td th:text="${r.batteryState}">-</td>
                    <td th:text="${r.thermalState}">-</td>
                    <td th:text="${r.connectionType}">-</td>
                </tr>
            </tbody>
        </table>
        <p th:if="${device.readings == null or device.readings.isEmpty()}" class="device-meta">No readings for this day.</p>
    </div>

    <p th:if="${dailyReport == null or dailyReport.devices == null or dailyReport.devices.isEmpty()}">No report data.</p>
</body>
</html>
